<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<title id="t">The KeyClerk estate</title>
<desc id="d">Drawn as the KeyClerk mark: two interlaced rings. On the orange ring, the guest's side: external guests and their own organisation's sign-in. Where the rings cross, the public edge: the lobby (in development), where guests ask, and the broker, where they sign in, federated with their own sign-in. On the ink ring, inside each organisation: homes, each a KeyClerk deployment with desk nodes, signer, custodian and signed records, which pull sealed requests from the lobby and trust the broker's tokens; and edges at the sites, which pull signed bundles from their home and work offline, with a bastion enforcing each lease in front of legacy systems. Every connection is opened from the inside.</desc>
