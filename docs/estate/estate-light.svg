<text x="552.0" y="228.0" font-size="13" font-weight="600" fill="#17142b" text-anchor="middle">Public edge</text>
<text x="552.0" y="244.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="middle">where the rings cross</text>
<text x="868.0" y="332.0" font-size="14" font-weight="600" fill="#17142b" text-anchor="end">External guests</text>
<text x="868.0" y="349.0" font-size="12" font-weight="400" fill="#555a67" text-anchor="end">visitors, contractors,</text>
<text x="868.0" y="364.0" font-size="12" font-weight="400" fill="#555a67" text-anchor="end">partner staff</text>
<text x="830.5" y="510.6" font-size="14" font-weight="600" fill="#17142b" text-anchor="start">Partner sign-in</text>
<text x="830.5" y="526.6" font-size="12" font-weight="400" fill="#555a67" text-anchor="start">their own identity provider</text>
<text x="552.0" y="280.0" font-size="13" font-weight="600" fill="#17142b" text-anchor="middle">Lobby</text>
<text x="552.0" y="296.0" font-size="11" font-weight="500" fill="#9a4a12" text-anchor="middle">in development</text>
<text x="552.0" y="384.0" font-size="13" font-weight="600" fill="#17142b" text-anchor="middle">Broker</text>
<text x="552.0" y="400.0" font-size="11" font-weight="500" fill="#555a67" text-anchor="middle">Keycloak sign-in</text>
<text x="300.0" y="296.0" font-size="14" font-weight="600" fill="#17142b" text-anchor="start">Home</text>
<text x="300.0" y="312.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="start">one deployment</text>
<text x="300.0" y="336.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="start">desk nodes</text>
<text x="300.0" y="358.0" font-size="12" font-weight="500" fill="#17142b" text-anchor="start">signer, custodian</text>
<text x="300.0" y="375.0" font-size="12" font-weight="500" fill="#17142b" text-anchor="start">signed records</text>
<text x="214.0" y="370.0" font-size="14" font-weight="600" fill="#17142b" text-anchor="middle">Edge</text>
<text x="214.0" y="386.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="middle">works offline</text>
<text x="104.0" y="300.0" font-size="14" font-weight="600" fill="#17142b" text-anchor="middle">Bastion</text>
<text x="104.0" y="316.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="middle">enforces the lease</text>
<text x="104.0" y="476.0" font-size="14" font-weight="600" fill="#17142b" text-anchor="middle">Legacy systems</text>
<text x="104.0" y="492.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="middle">SSH, RDP, web apps</text>
<text x="766.0" y="262.0" font-size="12" font-weight="500" fill="#9a4a12" text-anchor="end">asks</text>
<text x="758.0" y="412.0" font-size="12" font-weight="500" fill="#9a4a12" text-anchor="end">signs in</text>
<text x="604.0" y="472.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="start">federates</text>
<text x="486.0" y="252.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="end">pulls</text>
<text x="486.0" y="266.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="end">requests</text>
<text x="484.0" y="418.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="end">trusts</text>
<text x="484.0" y="432.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="end">tokens</text>
<text x="216.0" y="274.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="middle">pulls signed</text>
<text x="216.0" y="288.0" font-size="11" font-weight="400" fill="#555a67" text-anchor="middle">bundles</text>
