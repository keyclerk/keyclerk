\* must yield a counterexample: NoStartCheck breaks an assumption of decision 0033
CONSTANTS
    Signers = {a, b}
    MaxSigns = 2
    MaxLen = 3
    MaxMsgs = 2
    ActOnUncommitted = FALSE
    WitnessRollback = FALSE
    SplitCAS = FALSE
    NoBodies = FALSE
    UnfencedBreakGlass = FALSE
    ResetEmpty = FALSE
    NoStartCheck = TRUE
    FollowBelowOwn = FALSE
SPECIFICATION Spec
INVARIANT OneHistory
INVARIANT ActedCommitted
INVARIANT Takeover
