\* TLC: java -cp tla2tools.jar tlc2.TLC -config SignerFailover-SplitCAS.cfg SignerFailover.tla
\* must yield a counterexample: SplitCAS breaks an assumption of decision 0031
CONSTANTS
    Signers = {a, b}
    MaxSigns = 2
    MaxLen = 3
    MaxMsgs = 2
    ActOnUncommitted = FALSE
    WitnessRollback = FALSE
    SplitCAS = TRUE
    NoBodies = FALSE
    UnfencedBreakGlass = FALSE
    ResetEmpty = FALSE
SPECIFICATION Spec
INVARIANT OneHistory
INVARIANT ActedCommitted
INVARIANT Takeover
PROPERTY CommitOnlyGrows
