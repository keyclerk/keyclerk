\* TLC: java -cp tla2tools.jar tlc2.TLC -config SignerFailover-UnfencedBreakGlass.cfg SignerFailover.tla
\* must yield a counterexample: UnfencedBreakGlass breaks an assumption of decision 0031
CONSTANTS
    Signers = {a, b}
    MaxSigns = 2
    MaxLen = 3
    MaxMsgs = 2
    ActOnUncommitted = FALSE
    WitnessRollback = FALSE
    SplitCAS = FALSE
    NoBodies = FALSE
    UnfencedBreakGlass = TRUE
    ResetEmpty = FALSE
    NoStartCheck = FALSE
    FollowBelowOwn = FALSE
SPECIFICATION Spec
INVARIANT OneHistory
INVARIANT ActedCommitted
INVARIANT Takeover
PROPERTY CommitOnlyGrows
PROPERTY CustodianOneBody
PROPERTY NoSignBelowCommitted
