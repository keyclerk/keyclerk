# Updates for the pinned workflow actions, the hash-locked CI tools (REUSE, ruff) and the engine's locked dependencies, weekly, as pull requests that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ["*"]
