# SPDX-License-Identifier: EUPL-1.2
name: Bug
description: KeyClerk did something it should not, or refused something it should allow.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        A security problem goes to the private reporting form instead (SECURITY.md). Leave out names, e-mail
        addresses, tokens, keys and your organisation's records: a neutral example shows the bug as well.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest records and configuration that show it; the test fixtures' people (ann, bert) are welcome.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The answer or log line
      description: The desk's answer (outcome, reasons) or the error, with anything personal removed.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The KeyClerk version or commit, and the store (yaml or sqlite).
      placeholder: 0.26.1, sqlite
    validations:
      required: true
