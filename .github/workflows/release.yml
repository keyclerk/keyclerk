# SPDX-License-Identifier: EUPL-1.2
# A tag v* becomes a release: the wheel and source distribution built here, their SHA-256 sums, a build provenance
# attestation GitHub signs, a GitHub release, and PyPI through trusted publishing (no stored token; the pypi
# environment requires a maintainer's approval), and the container images (image.yml, issue 49).
# Verify: gh attestation verify FILE --repo keyclerk/keyclerk
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  sbom:
    # The SBOM tool and its dependencies install here, in a job that holds no write permission; the build job only
    # receives the file. CycloneDX JSON of the dependencies a KeyClerk install brings, from the hash-locked requirements.lock.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The SBOM of the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -m pip install --quiet --user --require-hashes -r requirements-sbom.txt
          mkdir sbom
          python3 -m cyclonedx_py requirements --pyproject pyproject.toml --output-reproducible --of JSON -o "sbom/keyclerk-${version}.cdx.json" requirements.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/
  build:
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom
          path: dist/
      - name: Build the wheel and the source distribution
        run: |
          python3 -m pip install --quiet --user --require-hashes -r requirements-build.txt
          python3 - <<'PY'          # the tag publishes the version the package says, or nothing (0.29.0-rc.1 is 0.29.0rc1)
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if Version(tag) != Version(pkg):
              raise SystemExit(f"the tag says {tag} and pyproject.toml {pkg}: not released")
          PY
          python3 -m build --outdir dist .
          cd dist && sha256sum * > SHA256SUMS     # the SBOM is in the sums, so the provenance covers it too
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir notes
          awk -v v="## ${version} " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "CHANGELOG.md has no section for ${version}: add it before tagging" >&2
            exit 1
          fi
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`, then \`gh attestation verify FILE --repo ${GITHUB_REPOSITORY}\`. The CycloneDX SBOM is \`keyclerk-${version}.cdx.json\`."
          } >> notes/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: notes/
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notes
          path: notes/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac     # v0.29.0-rc.1: a pre-release, never latest
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" \
            "${pre[@]}" --notes-file notes/notes.md \
            dist/*
  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS dist/*.cdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
  image:
    needs: build                                    # the tests and the release notes passed first
    strategy:
      matrix:
        include:
          - name: keyclerk
            context: .
          - name: keyclerk-custodian
            context: cmd/keyclerk-custodian
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      ref: ${{ github.ref_name }}
