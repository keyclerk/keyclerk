# SPDX-License-Identifier: EUPL-1.2
# One container image (issue 49), called by the release for each image and by the daily base rebuild: built twice from
# the tag with the commit's time (the digests must agree: reproducible), smoke-tested and scanned in the image, pushed to
# the GitHub container registry, then a build provenance and an SBOM attested and the digest signed with cosign
# (keyless). Verify: gh attestation verify oci://IMAGE@DIGEST --repo keyclerk/keyclerk, and cosign verify (README).
name: image
on:
  workflow_call:
    inputs:
      name:
        description: keyclerk or keyclerk-custodian
        type: string
        required: true
      context:
        description: the build context in the repository
        type: string
        required: true
      ref:
        description: the tag to build
        type: string
        required: true
      base:
        description: another base image, by digest (the daily rebuild); empty keeps the Containerfile's
        type: string
        default: ""
      extra_tag:
        description: one more tag to push besides the version and latest
        type: string
        default: ""
  workflow_dispatch:                    # a maintainer builds a tag's images again (its own signature names main)
    inputs:
      name:
        description: keyclerk or keyclerk-custodian
        type: choice
        options: [keyclerk, keyclerk-custodian]
        required: true
      context:
        description: the build context in the repository (. or cmd/keyclerk-custodian)
        type: string
        required: true
      ref:
        description: the tag to build
        type: string
        required: true
      base:
        description: another base image, by digest; empty keeps the Containerfile's
        type: string
        default: ""
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      NAME: ${{ inputs.name }}
      CONTEXT: ${{ inputs.context }}
      REF: ${{ inputs.ref }}
      BASE: ${{ inputs.base }}
      EXTRA_TAG: ${{ inputs.extra_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: BuildKit, pinned by digest
        run: |
          docker buildx create --use --name kc --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build twice from the tag; the digests must agree
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          args=()
          if [ -n "$BASE" ]; then args+=(--build-arg "BASE=${BASE}"); fi
          for i in 1 2; do
            docker buildx build -f "${CONTEXT}/Containerfile" --provenance=false --sbom=false --no-cache --platform linux/amd64 "${args[@]}" \
              --output "type=oci,dest=img${i}.tar,rewrite-timestamp=true" --metadata-file "meta${i}.json" "$CONTEXT"
          done
          d1="$(jq -r '."containerimage.digest"' meta1.json)"
          d2="$(jq -r '."containerimage.digest"' meta2.json)"
          if [ "$d1" != "$d2" ]; then echo "not reproducible: ${d1} and ${d2}" >&2; exit 1; fi
          echo "DIGEST=${d1}" >> "$GITHUB_ENV"
          docker buildx build -f "${CONTEXT}/Containerfile" --provenance=false --sbom=false --platform linux/amd64 "${args[@]}" --load -t "local/${NAME}:test" "$CONTEXT"
      - name: Smoke test in the image
        run: |
          if [ "$NAME" = keyclerk ]; then
            for m in keyclerk.reconcile keyclerk.desk keyclerk.signer keyclerk.console; do
              docker run --rm "local/${NAME}:test" "$m" --help > /dev/null
            done
            test "$(docker run --rm --entrypoint id "local/${NAME}:test" -u)" = 10001
          else
            out="$(docker run --rm "local/${NAME}:test" 2>&1 || true)"
            case "$out" in *"init|serve|recover"*) ;; *) echo "the custodian did not start: ${out}" >&2; exit 1;; esac
          fi
      - name: Scan the image; a fixable high or critical finding stops the release
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: local/${{ inputs.name }}:test
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Push the reproduced digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${NAME}"
          version="${REF#v}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          args=()
          if [ -n "$BASE" ]; then args+=(--build-arg "BASE=${BASE}"); fi
          tags="name=${image}:${version}"
          case "$version" in *-*) ;; *) tags="${tags},${image}:latest" ;; esac   # a release candidate never moves latest
          if [ -n "$EXTRA_TAG" ]; then tags="${tags},${image}:${EXTRA_TAG}"; fi
          docker buildx build -f "${CONTEXT}/Containerfile" --provenance=false --sbom=false --platform linux/amd64 "${args[@]}" \
            --output "type=image,\"${tags}\",push=true,oci-mediatypes=true,rewrite-timestamp=true" --metadata-file pushed.json "$CONTEXT"
          pushed="$(jq -r '."containerimage.digest"' pushed.json)"
          if [ "$pushed" != "$DIGEST" ]; then echo "the pushed digest ${pushed} is not the reproduced ${DIGEST}" >&2; exit 1; fi
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
      - name: The image's SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: local/${{ inputs.name }}:test
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the digest (keyless, this workflow's identity)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
